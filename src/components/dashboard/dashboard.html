<div class="container-fluid py-4">

  <div class="mb-4">
    <h4 class="fw-bold mb-1">Dashboard</h4>
    <p class="text-muted mb-0">Manage your products and users</p>
  </div>

  <ul class="nav nav-tabs mb-4">
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab === 'products'" (click)="activeTab = 'products'">
        <i class="bi bi-box-seam me-2"></i>Products
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab === 'users'" (click)="activeTab = 'users'">
        <i class="bi bi-people me-2"></i>Users
      </button>
    </li>
  </ul>

  @if (activeTab === 'products') {
    <app-productoperation></app-productoperation>
  }
  @if (activeTab === 'users') {
    <app-users></app-users>
  }

</div>
