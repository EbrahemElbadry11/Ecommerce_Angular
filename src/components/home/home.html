<div class="container-fluid p-0">
  <section class="bg-dark text-white text-center py-5 shadow-sm" 
           style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1500') center/cover;">
    <div class="container py-5">
      <h1 class="display-3 fw-bold">Welcome to Our Store</h1>
      <p class="lead mb-4">Discover the best deals on the latest high-quality products.</p>
      <a routerLink="/parent" class="btn btn-primary btn-lg px-5 rounded-pill" >Shop Now</a>
    </div>
  </section>

  <section class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Featured Products</h2>
      <a routerLink="/products" class="text-decoration-none">View All &rarr;</a>
    </div>

    <div class="row g-4">
      <!-- Product Card Example (Repeated via *ngFor) -->
      @for (product of products; track product.id) {
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100 shadow-sm border-0 product-card">
            <div class="position-relative overflow-hidden">
              <img [src]="product.image" class="card-img-top p-3" [alt]="product.name" style="height: 250px; object-fit: contain;">
              <span class="badge bg-danger position-absolute top-0 start-0 m-3" *ngIf="product.discount">Sale</span>
            </div>
            <div class="card-body text-center">
              <h5 class="card-title text-truncate">{{ product.name }}</h5>
              <p class="text-muted mb-2 small">{{ product.category }}</p>
              <div class="d-flex justify-content-center gap-2 mb-3">
                <span class="fw-bold text-primary">${{ product.price }}</span>
                <span class="text-decoration-line-through text-muted" *ngIf="product.oldPrice">${{ product.oldPrice }}</span>
              </div>
              <button class="btn btn-outline-primary w-100 rounded-pill shadow-sm">
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </section>

  
</div>
