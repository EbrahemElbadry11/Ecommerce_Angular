<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4 vh-100">
    <div class="card-header bg-primary text-white p-3 rounded-top-4 d-flex justify-content-between align-items-center">
      <h4 class="mb-0 fw-bold"><i class="bi bi-people-fill me-2"></i> Users List</h4>
      <span class="badge bg-light text-primary rounded-pill px-3">{{ data.length }} Users</span>
    </div>
    
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4">ID</th>
              <th>Full Name</th>
              <th>Email Address</th>
              <th>Phone</th>
              <th>Age</th>
              <th class="text-center pe-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            @if (data.length > 0) {
            @for (user of data; track user.id) {
            <tr >
              <td class="ps-4">
                <span class="fw-bold text-secondary">{{ user.id }}</span>
              </td>
              <td>
                <div class="d-flex align-items-center">
                  <span class="fw-semibold">{{ user.name }}</span>
                </div>
              </td>
              <td>{{ user.email }}</td>
              <td>
                <span class="text-muted"><i class="bi bi-telephone me-1"></i> {{ user.phone }}</span>
              </td>
              <td>
                <span class="badge bg-info-subtle text-info border border-info-subtle px-2">
                  {{ user.age }} years
                </span>
              </td>
            
              <td class="text-center pe-4">
                <button class="btn btn-outline-danger btn-sm rounded-pill px-3" (click)="deleteUser(user.id)">
                  <i class="bi bi-trash3 me-1"></i> Delete
                </button>
              </td>
            </tr>
          }}@else {
            
            <tr>
              <td colspan="6" class="text-center py-5">
                <div class="text-muted">
                  <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                  No users available to display.
                </div>
              </td>
            </tr>
          }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
