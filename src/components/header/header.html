<nav class="navbar navbar-expand-lg fixed-top custom-nav" [class.scrolled]="isScrolled">
  <div class="container">
    
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/home">
      <div class="brand-icon">✦</div>
      <span class="brand-text text-white fw-bold">BLUE LINK</span>
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-auto gap-1">
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/products" routerLinkActive="active-link">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/categories" routerLinkActive="active-link">Categories</a>
        </li>

        @if (isSeller) {
          <li class="nav-item">
            <a class="nav-link px-3 seller-link" routerLink="/sellers/dashboard" routerLinkActive="active-link">
              <i class="bi bi-shop me-1"></i> My Store
            </a>
          </li>
        }

        @if (isAdmin) {
          <li class="nav-item">
            <a class="nav-link px-3 admin-link" routerLink="/admin/dashboard" routerLinkActive="active-link">
              Admin Panel
            </a>
          </li>
        }
      </ul>

      <div class="d-flex align-items-center gap-3">
        @if (isLogged) {
          <div class="dropdown">
            <button class="profile-btn border-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
              <div class="avatar">{{ userInitial }}</div>
              <span class="d-none d-md-inline text-white-50">{{ userFullName }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg border-0 mt-3 animate-slide-in">
              <li><a class="dropdown-item py-2" routerLink="/user/profile">My Profile</a></li>
              @if (!isAdmin) {
                <li><a class="dropdown-item py-2" routerLink="/user/orders">Orders</a></li>
              }
              <li><hr class="dropdown-divider opacity-10"></li>
              <li><button class="dropdown-item py-2 text-danger" (click)="logout()">Logout</button></li>
            </ul>
          </div>
        } @else {
          <div class="d-flex gap-2">
            <a routerLink="/auth/login" class="btn btn-login">Login</a>
            <a routerLink="/auth/register" class="btn btn-register">Register</a>
          </div>
        }
        <button appDarkmode class="theme-toggle">🌙</button>
      </div>
    </div>
  </div>
</nav>
