<label for="categorySelect" class="form-label fw-bold text-muted ms-2">
    <i class="bi bi-filter-circle me-1"></i> Filter  
  </label>
  
<select  id="categorySelect" class="form-select form-select-lg rounded-pill border-2 border-primary shadow-sm px-4"  [(ngModel)]="selectedid" >
    <option [value]="0" selected>(All Products)</option>
    @for (cat of catlist; track cat.id) {
      <option [value]="cat.id">{{ cat.name }}</option>
    }
  </select>

  <div class="mb-4" style="max-width: 400px; margin: 0 auto;">
  
    <div class="row mt-5">
      <div class="col-12">
        <div class="card border-0 shadow-lg rounded-4 bg-primary text-white overflow-hidden">
          <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start">
            <div>
              <h4 class="mb-0 fw-bold">Order Summary</h4>
              <p class="mb-0 opacity-75">Estimated total for all displayed items</p>
            </div>
            <div class="mt-3 mt-md-0 d-flex align-items-center gap-4">
              <div class="text-md-end">
                <small class="d-block opacity-75">Grand Total</small>
                <h2 #myInput class="display-6 fw-bold mb-0">
                  {{ total | currency:'USD' }}
                </h2>
                <button 
                class="btn btn-success rounded-pill px-4 py-2 shadow-sm fw-bold border-0"
                (click)="focusInput()">
                Focus
                </button>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</div>

<app-products [Recivedid]="selectedid" (total)="recivedtotalprice($event)" > </app-products>
