<section class="page-shell">
  <div class="hero">
    <p class="eyebrow">Product editing</p>
    <h1>Edit product</h1>
    <p>
      Update the details, pricing, or category for this product.
    </p>

    <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>

  <div class="loading-card" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading product...</p>
  </div>

  <div class="empty-card" *ngIf="!isLoading && !product && errorMessage">
    <p>{{ errorMessage }}</p>
    <button type="button" class="primary-link" (click)="retry()">Retry</button>
  </div>

  <app-product-form
    *ngIf="!isLoading && product"
    mode="edit"
    [product]="product"
    [categories]="categories"
    (saved)="onSaved()"
    (success)="onSuccess($event)"
    (error)="onError($event)"
  ></app-product-form>
</section>
