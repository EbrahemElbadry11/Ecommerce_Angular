<section class="auth-shell">
  <div class="auth-panel">

    <span class="eyebrow">Password help</span>
    <h1>Forgot Password?</h1>

    <p style="text-align:center;color:#94a3b8;margin:-1rem 0 1.5rem;font-size:.95rem;">
      Enter your email and we'll send you a reset code
    </p>

    @if (message()) {
      <div class="alert" [class.alert-info]="sent()" [class.alert-danger]="!sent()">
        {{ sent() ? '📬' : '⚠' }} {{ message() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>

      <label>
        Email address
        <input type="email" formControlName="email"
               placeholder="you@example.com" autocomplete="email"/>
        @if (f.email.touched && f.email.hasError('required')) {
          <span class="field-error">⚡ Email is required</span>
        } @else if (f.email.touched && f.email.hasError('email')) {
          <span class="field-error">⚡ Enter a valid email</span>
        }
      </label>

      <button class="btn-primary" type="submit" [disabled]="loading() || sent()">
        @if (loading()) { <span class="spinner"></span> Sending... }
        @else if (sent()) { ✅ Code Sent! }
        @else { Send Reset Code }
      </button>

    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">Back to login</a>
      <a routerLink="/auth/register">Create account</a>
    </div>

  </div>
</section>
