<section class="auth-shell">
  <div class="auth-panel">

    <span class="eyebrow">Secure reset</span>
    <h1>Reset Password</h1>

    @if (message()) {
      <div class="alert" [class.alert-success]="success()" [class.alert-danger]="!success()">
        {{ success() ? '✅' : '⚠' }} {{ message() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>

      <!-- Email -->
      <label>
        Email address
        <input type="email" formControlName="email" placeholder="you@example.com"/>
        @if (f.email.touched && f.email.hasError('required')) {
          <span class="field-error">⚡ Email is required</span>
        } @else if (f.email.touched && f.email.hasError('email')) {
          <span class="field-error">⚡ Enter a valid email</span>
        }
      </label>

      <!-- Code -->
      <label>
        Verification code
        <input type="text" formControlName="verificationCode"
               placeholder="123456" maxlength="6"
               style="letter-spacing:.5rem;font-size:1.4rem;text-align:center;font-weight:700;"/>
        @if (f.verificationCode.touched && f.verificationCode.hasError('required')) {
          <span class="field-error">⚡ Code is required</span>
        } @else if (f.verificationCode.touched &&
                   (f.verificationCode.hasError('minlength') || f.verificationCode.hasError('maxlength'))) {
          <span class="field-error">⚡ Code must be exactly 6 digits</span>
        }
      </label>

      <!-- New Password -->
      <label>
        New password
        <div style="position:relative">
          <input [type]="showPass() ? 'text' : 'password'"
                 formControlName="newPassword"
                 placeholder="Min 8 chars, 1 upper, 1 number, 1 symbol"
                 style="padding-right:3rem"/>
          <button type="button"
                  (click)="showPass.set(!showPass())"
                  style="position:absolute;right:.875rem;top:50%;transform:translateY(-50%);
                         background:none;border:none;color:#94a3b8;cursor:pointer;font-size:1.1rem;">
            {{ showPass() ? '🙈' : '👁' }}
          </button>
        </div>
        @if (f.newPassword.touched && f.newPassword.hasError('required')) {
          <span class="field-error">⚡ Password is required</span>
        } @else if (f.newPassword.touched && f.newPassword.hasError('minlength')) {
          <span class="field-error">⚡ At least 8 characters</span>
        } @else if (f.newPassword.touched && f.newPassword.hasError('pattern')) {
          <span class="field-error">⚡ Must include uppercase, number & symbol</span>
        }
      </label>

      <!-- Confirm Password -->
      <label>
        Confirm new password
        <input type="password" formControlName="confirmNewPassword" placeholder="••••••••"/>
        @if (f.confirmNewPassword.touched && f.confirmNewPassword.hasError('required')) {
          <span class="field-error">⚡ Please confirm your password</span>
        } @else if (form.touched && form.hasError('mismatch')) {
          <span class="field-error">⚡ Passwords do not match</span>
        }
      </label>

      <button class="btn-primary" type="submit" [disabled]="loading() || success()">
        @if (loading()) { <span class="spinner"></span> Resetting... }
        @else if (success()) { ✅ Done! }
        @else { Reset Password }
      </button>

    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">Back to login</a>
      <a routerLink="/auth/forgot-password">Resend code</a>
    </div>

  </div>
</section>
