<div class="category-list-container">
  <!-- Header -->
  <div class="list-header">
    <div class="header-top">
      <div class="title-block">
        <span class="title-eyebrow">Browse</span>
        <h1 class="page-title">Shop by Category</h1>
      </div>
    </div>
    <p class="header-subtitle">Explore our curated product categories to find exactly what you need.</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="loader-ring"><div></div><div></div><div></div><div></div></div>
    <p>Loading categories...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage && !isLoading" class="error-state">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p>{{ errorMessage }}</p>
    <button (click)="retry()" class="retry-btn">Retry</button>
  </div>

  <!-- Categories Grid -->
  <div class="categories-grid" *ngIf="!isLoading && !errorMessage">
    <div *ngIf="categories.length === 0" class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="20" height="8" rx="2"/>
        <rect x="2" y="14" width="20" height="8" rx="2"/>
      </svg>
      <p>No categories available yet.</p>
    </div>

    <button
      *ngFor="let category of categories"
      class="category-card"
      (click)="viewCategory(category.categoryId)"
    >
      <div class="card-visual">
        <!-- ✅ استخدم الدالة getImageUrl -->
        <img
          [src]="getImageUrl(category.icon)"
          [alt]="category.name"
          class="card-icon-img"
          (error)="onImageError($event)"
        />
      </div>
      <div class="card-content">
        <h3 class="card-name">{{ category.name }}</h3>
        <span class="card-link">
          Browse Products
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </div>
    </button>
  </div>
</div>
