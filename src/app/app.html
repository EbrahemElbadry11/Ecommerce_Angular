<router-outlet></router-outlet>


<div
  class="toast-container position-fixed bottom-0 end-0 p-4"
  style="z-index: 1200"
>
  @for (toast of toastService.toasts(); track toast) {

    <div
      class="custom-toast mb-3 d-flex flex-column align-items-stretch text-white px-3 py-3 rounded-4 shadow-lg bg-{{toast.type}} animate"
      role="alert"
      style="min-width: 300px;"
    >

      <!-- محتوى الرسالة -->
      <div class="d-flex align-items-center justify-content-start mb-2">
        <div class="d-flex align-items-center gap-2">
          <span class="fw-semibold">
            {{ toast.message }}
          </span>
        </div>
      </div>

      <!-- أزرار الـ Confirm -->
      @if (toast.isConfirm) {
        <div
          class="d-flex justify-content-end gap-2 mt-2"
          style="pointer-events: auto;"
        >
          <button
            type="button"
            class="btn btn-sm btn-light text-dark fw-bold px-3 rounded-3"
            (click)="handleToastConfirm(toast)"
          >
            {{ toast.confirmText || 'Confirm' }}
          </button>

          <button
            type="button"
            class="btn btn-sm btn-outline-light px-3 rounded-3"
            (click)="toastService.remove(toast)"
          >
            {{ toast.cancelText || 'Cancel' }}
          </button>
        </div>
      }

    </div>

  }
</div>
